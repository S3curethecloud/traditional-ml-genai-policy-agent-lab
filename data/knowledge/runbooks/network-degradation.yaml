document:
  document_id: runbook-network-degradation
  title: Regional network degradation runbook
  document_type: runbook
  tenant_id: tenant-alpha
  service: identity-api
  environment_scope:
    - staging
    - production
  allowed_roles:
    - incident_responder
    - production_operator
    - incident_commander
  sensitivity: internal
  created_at: "2026-03-19T08:00:00Z"
  updated_at: "2026-07-09T11:00:00Z"
  trusted_instruction_source: true
  content: |
    Use this runbook when packet loss or cross-region latency increases.

    A single packet-loss measurement is insufficient to diagnose network
    degradation. Confirm persistence across multiple measurement intervals and
    correlate the signal with latency, retransmissions, affected regions, and
    user impact.
