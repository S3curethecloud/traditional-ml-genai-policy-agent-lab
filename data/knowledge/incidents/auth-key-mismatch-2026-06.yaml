document:
  document_id: incident-auth-key-mismatch-2026-06
  title: Prior incident involving signing-key mismatch
  document_type: prior_incident
  tenant_id: tenant-alpha
  service: identity-api
  environment_scope:
    - production
  allowed_roles:
    - incident_responder
    - production_operator
    - incident_commander
    - security_reviewer
  sensitivity: restricted
  created_at: "2026-06-18T08:00:00Z"
  updated_at: "2026-06-20T12:00:00Z"
  trusted_instruction_source: false
  content: |
    Login failures increased after a configuration deployment.

    Evidence:
    - Token key identifiers did not match the active signing-key set.
    - Failures affected one region first and expanded after cache refresh.
    - CPU and memory remained normal.

    Resolution:
    The configuration was corrected after human approval. No service restart
    was required.
