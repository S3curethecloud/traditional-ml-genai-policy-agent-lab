  content: |
    A single packet-loss measurement crossed the alert threshold.

    Follow-up measurements were normal. Latency, retransmissions, and user
    errors did not increase. The event was classified as measurement noise.

    Lesson:
    Require corroborating telemetry before diagnosing network degradation.
